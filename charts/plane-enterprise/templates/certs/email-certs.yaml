{{- if eq (include "plane.emailCertEnabled" .) "true" }}
{{- $issuerRef := .Values.services.email_service.certIssuerRef | default dict }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-mail-tls-cert
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
  - {{ .Values.env.email_service_envs.smtp_domain | quote }}
  
  issuerRef:
    {{- if $issuerRef.name }}
    name: {{ $issuerRef.name }}
    {{- with $issuerRef.kind }}
    kind: {{ . }}
    {{- end }}
    {{- else }}
    name: {{ .Release.Name }}-cert-issuer
    {{- end }}
  secretName: {{ .Release.Name }}-mail-tls-secret
--- 
{{- end }}