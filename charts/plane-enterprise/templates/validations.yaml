{{- /*
Renders no resource. Holds the checks that must run regardless of which templates are
switched off, so they live here rather than inside a conditional template.
*/ -}}

{{- /*
PodDisruptionBudget misuse. A budget that cannot protect anything is not inert -- it blocks
drains -- so the three ways to ask for one that will not work are refused rather than ignored.
*/ -}}
{{- $eligible := include "plane.pdbEligible" . | fromYaml -}}

{{- range $key, $svc := .Values.services }}
{{- /* services may also hold scalar settings (e.g. storage_class) -- skip anything that is not a map. */ -}}
{{- $opts := dict }}
{{- if kindIs "map" $svc }}
{{- $opts = $svc.podDisruptionBudget | default dict }}
{{- end }}
{{- if and (hasKey $opts "enabled") $opts.enabled (not (hasKey $eligible $key)) }}
{{- fail (printf `
services.%s.podDisruptionBudget.enabled is set, but %s cannot have a budget.

It is either a single-replica workload by design (beatworker, pi_beat_worker, argus,
the migration Jobs) or an in-chart stateful service on a ReadWriteOnce volume (postgres, redis,
rabbitmq, opensearch, minio).

A PodDisruptionBudget only decides whether an eviction is ALLOWED. With one replica there is no
second copy to keep serving, so the budget cannot protect the workload -- it can only refuse the
eviction until the drain gives up or the node is removed under it, which turns a routine node
rotation into a stuck one.

  Scheduled/coordinator singletons: leave them unprotected. They reschedule in seconds.
  Stateful services: set local_setup=false and use a managed, multi-AZ equivalent.
` $key $key) }}
{{- end }}
{{- end }}

{{- range $key, $app := $eligible }}
{{- $svc := (index $.Values.services $key) | default dict }}
{{- $opts := $svc.podDisruptionBudget | default dict }}
{{- $replicas := $svc.replicas | default 1 | int }}
{{- if and (hasKey $opts "enabled") $opts.enabled (lt $replicas 2) }}
{{- fail (printf `
services.%s.podDisruptionBudget.enabled is set, but services.%s.replicas is %d.

A budget needs a second replica to hand the traffic to. At one replica the only thing it can do
is refuse the eviction, so a node drain stalls instead of the service staying up.

  Set services.%s.replicas to 2 or more, then the budget protects it.
  Or drop the podDisruptionBudget key and accept the restart window on drains.

The chart-wide default (podDisruptionBudget.enabled) deliberately does NOT fail here -- it skips
single-replica workloads silently so that turning budgets on globally stays a one-line change.
This message only appears when the budget was asked for on this specific service.
` $key $key $replicas $key) }}
{{- end }}
{{- end }}

{{- range $key, $opts := (dict "<chart-wide>" (.Values.podDisruptionBudget | default dict)) }}
{{- if and (hasKey $opts "minAvailable") (hasKey $opts "maxUnavailable") }}
{{- fail (printf "podDisruptionBudget sets both minAvailable (%v) and maxUnavailable (%v); the Kubernetes API accepts only one. Prefer maxUnavailable: it keeps its meaning when the replica count changes, where minAvailable can wedge every drain of a workload that was scaled back to 1." $opts.minAvailable $opts.maxUnavailable) }}
{{- end }}
{{- end }}

{{- range $key, $app := $eligible }}
{{- $opts := ((index $.Values.services $key) | default dict).podDisruptionBudget | default dict }}
{{- if and (hasKey $opts "minAvailable") (hasKey $opts "maxUnavailable") }}
{{- fail (printf "services.%s.podDisruptionBudget sets both minAvailable (%v) and maxUnavailable (%v); the Kubernetes API accepts only one." $key $opts.minAvailable $opts.maxUnavailable) }}
{{- end }}
{{- end }}

{{- /*
Redis Sentinel (bring your own). Sentinel always means an external Redis: the chart's
local_setup is a single Valkey node with no sentinels, and a remote URL would pin every
service to one node, which is what Sentinel mode exists to avoid.
*/ -}}
{{- if include "plane.redisSentinel" . }}
{{- if .Values.services.redis.local_setup }}
{{- fail "env.redis_sentinels is set (Redis Sentinel mode) while services.redis.local_setup is true. Sentinel mode connects to a Redis you run; the chart never deploys Sentinel. local_setup defaults to true, so set services.redis.local_setup: false explicitly, or clear env.redis_sentinels to keep the bundled Redis." }}
{{- end }}
{{- if not (trim (.Values.env.redis_sentinel_master | default "" | toString)) }}
{{- fail "env.redis_sentinels is set (Redis Sentinel mode) but env.redis_sentinel_master is empty. Set it to the master (service) name your sentinels monitor, e.g. 'mymaster' from `sentinel monitor mymaster ...`." }}
{{- end }}
{{- /* A bare scheme is questions.yml's placeholder for the URL field, not a URL. */}}
{{- $remoteUrl := trim (.Values.env.remote_redis_url | default "" | toString) }}
{{- if and $remoteUrl (not (has $remoteUrl (list "redis://" "rediss://"))) }}
{{- fail "env.redis_sentinels is set (Redis Sentinel mode) together with env.remote_redis_url. Choose one: clear env.remote_redis_url to use Sentinel (put the data-node password in env.redis_password or external_secrets.redis), or clear env.redis_sentinels to keep the single URL." }}
{{- end }}
{{- end }}
