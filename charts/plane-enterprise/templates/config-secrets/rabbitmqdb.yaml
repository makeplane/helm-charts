{{- /* Not rendered with external_secrets.rabbitmq.secretName: the broker then reads its
       user from that Secret, and default_user/default_password stay out of the release. */}}
{{- if and .Values.services.rabbitmq.local_setup  (empty .Values.external_secrets.rabbitmq_existingSecret) (not (include "plane.bundledRabbitmqFromSecret" .)) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-rabbitmq-secrets
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.services.rabbitmq.default_user | default "plane" | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.services.rabbitmq.default_password | default "plane" |quote }}
---

{{- end }}