{{/* Externalized credentials describe a REMOTE backend. Paired with a bundled one the
     chart would hand the app a credential from the operator's Secret and the in-cluster
     endpoint from plane.{postgres,redis,rabbitmq}Host — and the bundled service never
     authenticates that credential. For redis it is worse: plane.externalRedis also blanks
     REDIS_URL, so an older image is left with no route to Redis at all. Fail at render
     time rather than at runtime. plane.externalOpensearch already refuses this pairing;
     these three did not. */}}
{{- if and .Values.external_secrets.database.secretName .Values.services.postgres.local_setup }}
{{- fail "external_secrets.database.secretName is set while services.postgres.local_setup is true — externalized credentials cannot authenticate against the bundled Postgres. Set services.postgres.local_setup: false and point env.pgdb_host at the remote database, or drop external_secrets.database.secretName" }}
{{- end }}
{{- if and .Values.external_secrets.redis.secretName .Values.services.redis.local_setup }}
{{- fail "external_secrets.redis.secretName is set while services.redis.local_setup is true — externalized credentials cannot authenticate against the bundled Redis, and REDIS_URL is blanked. Set services.redis.local_setup: false and point env.redis_host at the remote cache, or drop external_secrets.redis.secretName" }}
{{- end }}
{{- if and .Values.external_secrets.rabbitmq.secretName .Values.services.rabbitmq.local_setup }}
{{- fail "external_secrets.rabbitmq.secretName is set while services.rabbitmq.local_setup is true — externalized credentials cannot authenticate against the bundled RabbitMQ. Set services.rabbitmq.local_setup: false and point env.rabbitmq_host at the remote broker, or drop external_secrets.rabbitmq.secretName" }}
{{- end }}

{{/* The replica needs a source of connection details: a DSN in values, a Secret the
     operator owns, or the discrete-parts mirror. Without one of those, enabling it
     would silently produce a replica entry with no host. */}}
{{- if and .Values.services.postgres.read_replica.enabled
           (not .Values.services.postgres.read_replica.remote_url)
           (empty .Values.external_secrets.app_env_existingSecret)
           (not (include "plane.externalReadReplica" .)) }}
{{- fail "read_replica.enabled is true but no source of replica credentials is configured — set services.postgres.read_replica.remote_url, or external_secrets.database.readReplica.secretName (or external_secrets.database.secretName, which it falls back to) together with env.pgdb_read_replica_host" }}
{{- end }}
{{/* Credentials are only half of it. plane.postgresReadReplicaCredsEnv renders
     POSTGRES_READ_REPLICA_HOST from env.pgdb_read_replica_host, so with that unset and no
     hostKey in the mirrored secret the replica gets an empty host. The API deliberately
     does NOT fall back to the primary there (it would send every "replica" read to the
     writer with no error), so an empty host is a broken replica, not a slow one. */}}
{{- if and (include "plane.externalReadReplica" .)
           (not .Values.services.postgres.read_replica.remote_url)
           (not .Values.env.pgdb_read_replica_host)
           (not .Values.external_secrets.database.readReplica.hostKey) }}
{{- fail "read_replica.enabled is true with externalized credentials but no replica endpoint — set env.pgdb_read_replica_host, or external_secrets.database.readReplica.hostKey if the mirrored secret carries the replica host" }}
{{- end }}
{{- if empty .Values.external_secrets.app_env_existingSecret}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-app-secrets
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
stringData:
  {{- if empty .Values.external_secrets.app_keys_existingSecret }}
  SECRET_KEY: {{ include "plane.secretValue" (dict "context" $ "name" "env.secret_key" "value" .Values.env.secret_key "fallback" "60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5") | quote }}
  AES_SECRET_KEY: {{ include "plane.secretValue" (dict "context" $ "name" "env.silo_envs.aes_secret_key" "value" .Values.env.silo_envs.aes_secret_key "fallback" "dsOdt7YrvxsTIFJ37pOaEVvLxN8KGBCr") | quote }}
  {{- with .Values.env.silo_envs.aes_salt }}
  {{/* Rendered only when set: api, silo and pi all default to "aes-salt" internally,
       so emitting an empty value would break decryption on existing instances. */}}
  AES_SALT: {{ . | quote }}
  {{- end }}
  LIVE_SERVER_SECRET_KEY: {{ include "plane.secretValue" (dict "context" $ "name" "env.live_server_secret_key" "value" .Values.env.live_server_secret_key "fallback" "htbqvBJAgpm9bzvf3r4urJer0ENReatceh") | quote }}
  PI_INTERNAL_SECRET: {{ include "plane.secretValue" (dict "context" $ "name" "env.pi_envs.internal_secret" "value" .Values.env.pi_envs.internal_secret "fallback" "tyfvfqvBJAgpm9bzvf3r4urJer0Ehfdubk") | quote }}
  {{- end }}

  {{- if include "plane.externalRedis" . }}
  {{/* Credentials come from external_secrets.redis as discrete REDIS_* parts.
       Left empty on purpose: the API prefers REDIS_URL when it is set, so a
       composed URL here would shadow the rotated password. */}}
  REDIS_URL: ""
  {{- else if .Values.services.redis.local_setup }}
  REDIS_URL: "redis://{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:6379/"
  {{- else }}
  REDIS_URL: {{ .Values.env.remote_redis_url | default "" | quote }}
  {{- end }}

  {{- if include "plane.externalDatabase" . }}
  {{/* Credentials come from external_secrets.database as discrete POSTGRES_* parts. */}}
  DATABASE_URL: ""
  {{- else if .Values.services.postgres.local_setup }}
  DATABASE_URL: "postgresql://{{ .Values.env.pgdb_username }}:{{ .Values.env.pgdb_password }}@{{ .Release.Name }}-pgdb.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}/{{ .Values.env.pgdb_name }}"
  {{- else if .Values.env.pgdb_remote_url }}
  DATABASE_URL: {{ .Values.env.pgdb_remote_url}}
  {{- else }}
  DATABASE_URL: ""
  {{- end }}

  {{- if include "plane.externalReadReplica" . }}
  {{/* Credentials come from the readReplica mirror as discrete
       POSTGRES_READ_REPLICA_* parts. Left empty on purpose: the API prefers
       DATABASE_READ_REPLICA_URL when set, so a composed URL here would shadow the
       rotated password. */}}
  DATABASE_READ_REPLICA_URL: ""
  {{- else if and .Values.services.postgres.read_replica.enabled .Values.services.postgres.read_replica.remote_url }}
  DATABASE_READ_REPLICA_URL: {{ .Values.services.postgres.read_replica.remote_url | quote }}
  {{- end }}

  {{- if include "plane.externalRabbitmq" . }}
  {{/* Credentials come from external_secrets.rabbitmq as discrete RABBITMQ_* parts. */}}
  AMQP_URL: ""
  {{- else if .Values.services.rabbitmq.local_setup }}
  AMQP_URL: "amqp://{{ .Values.services.rabbitmq.default_user}}:{{ .Values.services.rabbitmq.default_password}}@{{ .Release.Name }}-rabbitmq.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}/"
  {{- else if .Values.services.rabbitmq.external_rabbitmq_url }}
  AMQP_URL: {{ .Values.services.rabbitmq.external_rabbitmq_url}}
  {{- else }}
  AMQP_URL: ""
  {{- end }}

  {{- if include "plane.s3CAEnabled" . }}
  AWS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
  {{- end }}
{{- end }}
---

apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-app-vars
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
data:
  PRIME_HOST: {{ .Values.license.licenseServer | quote }}
  MACHINE_SIGNATURE: {{ include "hashString" . | quote }}
  APP_DOMAIN: {{ .Values.license.licenseDomain | quote }}
  APP_VERSION: {{ .Values.planeVersion | quote }}
  PAYMENT_SERVER_BASE_URL: "http://{{ .Release.Name }}-monitor.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:8080/"
  FEATURE_FLAG_SERVER_BASE_URL: "http://{{ .Release.Name }}-monitor.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:8080/"

  DEFAULT_API_RATE_LIMIT: {{ .Values.env.api_key_rate_limit | default "120/minute" | quote }}
  {{- /* '0' makes the API re-read SMTP/OAuth/LLM/LDAP secrets from the environment on
       every start instead of from the instance-configuration table, which is what
       lets an external secret store rotate them. See values.yaml env.skip_env_var. */}}
  SKIP_ENV_VAR: {{ .Values.env.skip_env_var | default "1" | quote }}
  MINIO_ENDPOINT_SSL: {{ .Values.services.minio.env.minio_endpoint_ssl | default false | ternary "1" "0" | quote }}
  USE_STORAGE_PROXY: {{ .Values.env.use_storage_proxy | default false | ternary "1" "0" | quote }}
  ALLOW_ALL_ATTACHMENT_TYPES: {{ .Values.env.allow_all_attachment_types | default false | ternary "1" "0" | quote }}
  ENABLE_DRF_SPECTACULAR: {{ .Values.env.enable_drf_spectacular | default false | ternary "1" "0" | quote }}
  ENABLE_READ_REPLICA: {{ .Values.services.postgres.read_replica.enabled | default false | ternary "1" "0" | quote }}
  INTAKE_EMAIL_DOMAIN: {{ .Values.env.email_service_envs.smtp_domain | default "" | quote }}

  SENTRY_DSN: {{ .Values.env.sentry_dsn | default "" | quote}}
  SENTRY_ENVIRONMENT: {{ .Values.env.sentry_environment | default "" | quote}}
  DEBUG: "0"
  DOCKERIZED: "1"
  GUNICORN_WORKERS: {{ .Values.env.gunicorn_workers | default 1 | quote }}
  GUNICORN_MAX_REQUESTS: {{ .Values.env.gunicorn_max_requests | quote }}
  GUNICORN_MAX_REQUESTS_JITTER: {{ .Values.env.gunicorn_max_requests_jitter | quote }}
  CELERY_TASK_PUBLISH_RETRY: {{ .Values.env.celery_task_publish_retry | ternary "1" "0" | quote }}
  CELERY_BROKER_POOL_LIMIT: {{ .Values.env.celery_broker_pool_limit | quote }}
  {{- if .Values.env.web_url}}
  WEB_URL: {{ .Values.env.web_url | default "" | quote }}
  {{- else if eq (include "plane.tlsEnabled" .) "true" }}
  WEB_URL: "https://{{ .Values.license.licenseDomain }}"
  {{- else }}
  WEB_URL: "http://{{ .Values.license.licenseDomain }}"
  {{- end }}

  LIVE_BASE_URL: "http://{{ .Release.Name }}-live.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:3000/"
  LIVE_BASE_PATH: "/live"
  {{- if eq (include "plane.tlsEnabled" .) "true" }}
  PI_BASE_URL: "https://{{ .Values.license.licenseDomain }}"
  {{- else }}
  PI_BASE_URL: "http://{{ .Values.license.licenseDomain }}"
  {{- end }}
  PI_BASE_PATH: "/pi"

  {{- if .Values.services.runner.enabled }}
  RUNNER_BASE_URL: "http://{{ .Release.Name }}-runner.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:3000"
  {{- end }}

  {{- if .Values.airgapped.enabled }}
  IS_AIRGAPPED: "1"
  {{- end }}

  {{- if eq .Values.env.cors_allowed_origins "*"}}
  CORS_ALLOWED_ORIGINS: "*"
  {{- else if .Values.env.cors_allowed_origins }}
  CORS_ALLOWED_ORIGINS: "http://{{ .Values.license.licenseDomain }},https://{{ .Values.license.licenseDomain }},{{ .Values.env.cors_allowed_origins }}"
  {{- else}}
  CORS_ALLOWED_ORIGINS: "http://{{ .Values.license.licenseDomain }},https://{{ .Values.license.licenseDomain }}"
  {{- end }}

  WEBHOOK_ALLOWED_IPS: {{ .Values.env.webhook_allowed_ips | default "" | quote }}
  WEBHOOK_ALLOWED_HOSTS: {{ .Values.env.webhook_allowed_hosts | default "" | quote }}
  AI_USAGE_AGENT_MAX_TOKENS_BUDGET: {{ .Values.env.pi_envs.ai_usage_agent_max_tokens_budget | default "" | quote }}
