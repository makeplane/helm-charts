{{- if empty .Values.external_secrets.live_env_existingSecret}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-live-secrets
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
stringData:
  {{- if empty .Values.external_secrets.app_keys_existingSecret }}
  LIVE_SERVER_SECRET_KEY: {{ include "plane.secretValue" (dict "context" $ "name" "env.live_server_secret_key" "value" .Values.env.live_server_secret_key "fallback" "htbqvBJAgpm9bzvf3r4urJer0ENReatceh") | quote }}
  {{- end }}
  {{- if include "plane.externalRedis" . }}
  {{/* Credentials come from external_secrets.redis as discrete REDIS_* parts.
       Left empty on purpose: live prefers a URL when one is set, so a composed URL
       here would shadow the rotated password. */}}
  REDIS_URL: ""
  {{- else if .Values.services.redis.local_setup }}
  REDIS_URL: "redis://{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:6379/"
  {{- else }}
  REDIS_URL: {{ .Values.env.remote_redis_url | default "" | quote }}
  {{- end }}
  {{- if include "plane.externalRabbitmq" . }}
  {{/* Emptied so the RABBITMQ_* parts take over, the same way REDIS_URL above does. live's
       isSet() treats "" as unset. Without this the mirror is inert for live and
       live-exporter: the URL wins over the parts, so a rotated broker password never
       reaches them. */}}
  AMQP_URL: ""
  {{- else if .Values.services.rabbitmq.local_setup }}
  AMQP_URL: "amqp://{{ .Values.services.rabbitmq.default_user }}:{{ .Values.services.rabbitmq.default_password }}@{{ .Release.Name }}-rabbitmq.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}/"
  {{- else if .Values.services.rabbitmq.external_rabbitmq_url }}
  AMQP_URL: {{ .Values.services.rabbitmq.external_rabbitmq_url | quote }}
  {{- else }}
  AMQP_URL: ""
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-live-vars
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
data:
  API_BASE_URL: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:8000/"
  LIVE_SENTRY_DSN: {{ .Values.env.live_sentry_dsn | default "" | quote }}
  LIVE_SENTRY_ENVIRONMENT: {{ .Values.env.live_sentry_environment | default "" | quote }}
  LIVE_SENTRY_TRACES_SAMPLE_RATE: {{ .Values.env.live_sentry_traces_sample_rate | default "" | quote }}
  LIVE_BASE_PATH: "/live"
  {{- if or .Values.ssl.tls_secret_name (and .Values.ssl.createIssuer .Values.ssl.generateCerts) }}
  PI_BASE_URL: "https://{{ .Values.license.licenseDomain }}"
  {{- else }}
  PI_BASE_URL: "http://{{ .Values.license.licenseDomain }}"
  {{- end }}
  PI_BASE_PATH: "/pi"

  {{- if .Values.env.external_iframely_url }}
  IFRAMELY_URL: {{ .Values.env.external_iframely_url | default "" | quote }}
  {{- else }}
  IFRAMELY_URL: http://{{ .Release.Name }}-iframely.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:8061/
  {{- end }}

  {{- if or .Values.ssl.tls_secret_name (and .Values.ssl.createIssuer .Values.ssl.generateCerts) }}
  EXPORT_DOWNLOAD_BASE_URL: {{ .Values.env.export_download_base_url | default (printf "https://%s" .Values.license.licenseDomain) | quote }}
  {{- else }}
  EXPORT_DOWNLOAD_BASE_URL: {{ .Values.env.export_download_base_url | default (printf "http://%s" .Values.license.licenseDomain) | quote }}
  {{- end }}

  EXPORT_QUEUE_NAME: {{ .Values.env.export_queue_name | default "plane-exports" | quote }}

---
