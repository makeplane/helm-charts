{{- if eq (include "plane.minioEnabled" .) "true" }}{{- $minioBucketJobSpec := include "plane.minioBucketJobSpec" . }}
{{- /* The bucket name and credentials reach the bucket Job through the doc-store
       Secret, not its spec, so its run suffix hashes that Secret and the chart
       version too. */}}
{{- $minioBucketJobRun := print $minioBucketJobSpec .Chart.Version (include (print .Template.BasePath "/config-secrets/doc-store.yaml") .) }}

apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-minio
  labels:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
    {{- include "plane.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  {{- if not .Values.services.minio.assign_cluster_ip }}
  clusterIP: None
  {{- end }}
  ports:
  - name: minio-api-9000
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: minio-console-9090
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-minio-wl
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.minio) }}
spec:
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
  serviceName:  {{ .Release.Name }}-minio
  template:
    metadata:
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      {{- if empty .Values.external_secrets.doc_store_existingSecret }}
      annotations:
        {{- /* MinIO reads its root login from this Secret only at start. Without a restart a
               changed password reaches the app pods (checksum/config) but not MinIO, and
               every file request fails until MinIO restarts. */}}
        checksum/doc-store: {{ include (print .Template.BasePath "/config-secrets/doc-store.yaml") . | sha256sum | quote }}
      {{- end }}
    spec:
      {{- include "plane.podScheduling" .Values.services.minio }}
      containers:
      - image: {{ .Values.services.minio.image }}
        imagePullPolicy: {{ .Values.services.minio.pullPolicy | default "IfNotPresent" }}
        name: {{ .Release.Name }}-minio
        stdin: true
        tty: true
        # command:
        args:
          - server
          - /data
          - --console-address 
          - :9090
        {{- with .Values.services.minio.idle_timeout }}
        env:
          # Opt-in: MinIO's 30s default resets silo's ranged read of a large
          # import ZIP while it writes batches.
          - name: MINIO_IDLE_TIMEOUT
            value: {{ . | quote }}
        {{- end }}
        envFrom:
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.doc_store_existingSecret) }}{{ .Values.external_secrets.doc_store_existingSecret }}{{ else }}{{ .Release.Name }}-doc-store-secrets{{ end }}
              optional: false
        volumeMounts:
        - mountPath: /data
          name: pvc-{{ .Release.Name }}-minio-vol
          subPath: ''
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      namespace: {{ .Release.Namespace }}
      name: pvc-{{ .Release.Name }}-minio-vol
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.services.minio.volumeSize | default "5Gi" | quote }}
      storageClassName: {{ .Values.env.storageClass | quote }}
      volumeMode: Filesystem

---

apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-minio-bucket-{{ include "plane.jobRunSuffix" (dict "context" . "spec" $minioBucketJobRun) }}
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.minio) }}
{{ $minioBucketJobSpec }}
{{- end }}
{{- define "plane.minioBucketJobSpec" -}}
spec:
  backoffLimit: 6
  completionMode: NonIndexed
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
    spec:
      {{- include "plane.podScheduling" .Values.services.minio }}
      restartPolicy: OnFailure
      initContainers:
        - name: init
          image: {{ .Values.services.minio.init_image | default "busybox" }}
          command: ['sh', '-c', "until nslookup  {{ .Release.Name }}-minio.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}; do echo waiting for  {{ .Release.Name }}-minio; sleep 2; done"]
      containers:
        - name: {{ .Release.Name }}-minio-bucket
          image: {{ .Values.services.minio.image_mc }}
          imagePullPolicy: Always
          command:
            - /bin/sh
          {{- /* Every step must succeed, so a failure retries the Job instead of leaving the
                 bucket missing or on an older policy. Anonymous clients may read a file by its
                 path (the links Plane wrote before its v2 asset endpoints point straight at
                 the bucket) but never list the bucket, which all workspaces share. */}}
          args:
            - '-c'
            - >-
              i=0;
              until /usr/bin/mc alias set plane-app-minio
              http://{{ .Release.Name }}-minio.{{ .Release.Namespace }}.svc.{{ .Values.env.default_cluster_domain | default "cluster.local" }}:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY";
              do i=$((i+1)); [ "$i" -ge 30 ] && exit 1; sleep 2; done;
              /usr/bin/mc mb --ignore-existing plane-app-minio/$AWS_S3_BUCKET_NAME &&
              {{- if include "plane.minioAnonymousObjectRead" . }}
              printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$AWS_S3_BUCKET_NAME" > /tmp/anonymous-read.json &&
              /usr/bin/mc anonymous set-json /tmp/anonymous-read.json plane-app-minio/$AWS_S3_BUCKET_NAME
              {{- else }}
              /usr/bin/mc anonymous set none plane-app-minio/$AWS_S3_BUCKET_NAME
              {{- end }}
          envFrom:
            - secretRef:
                name: {{ if not (empty .Values.external_secrets.doc_store_existingSecret) }}{{ .Values.external_secrets.doc_store_existingSecret }}{{ else }}{{ .Release.Name }}-doc-store-secrets{{ end }}
                optional: false
          {{- if .Values.extraEnv }}
          env:
            {{- toYaml .Values.extraEnv | nindent 10 }}
          {{- end }}
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
      terminationGracePeriodSeconds: 120
{{- end }}