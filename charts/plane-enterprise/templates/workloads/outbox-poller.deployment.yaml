{{- if .Values.services.outbox_poller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-outbox-poller-wl
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.outbox_poller) }}
spec:
  replicas: {{ .Values.services.outbox_poller.replicas | default 1}}
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-outbox-poller
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-outbox-poller
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      annotations:
        {{- include "plane.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "plane.podScheduling" .Values.services.outbox_poller }}
      {{- include "plane.podSecurityContext" . }}
      containers:
      - name: {{ .Release.Name }}-outbox-poller
        {{- include "plane.containerSecurityContext" . }}
        imagePullPolicy: Always
        image: {{ .Values.services.api.image | default "makeplane/backend-commercial" }}:{{ .Values.planeVersion }}
        stdin: true
        tty: true
        resources:
          requests:
            memory: {{ .Values.services.outbox_poller.memoryRequest  | default "256Mi" | quote }}
            cpu: {{ .Values.services.outbox_poller.cpuRequest | default "100m" | quote}}
          limits:
            memory: {{ .Values.services.outbox_poller.memoryLimit  | default "1000Mi" | quote }}
            cpu: {{ .Values.services.outbox_poller.cpuLimit | default "500m" | quote}}
        command:
          - ./bin/docker-entrypoint-outbox-poller.sh
        envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-outbox-poller-vars
              optional: false
          - configMapRef:
              name: {{ .Release.Name }}-app-vars
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.app_env_existingSecret) }}{{ .Values.external_secrets.app_env_existingSecret }}{{ else }}{{ .Release.Name }}-app-secrets{{ end }}
              optional: false
          {{- with (include "plane.otel.envFrom" $) }}{{ . | nindent 10 }}{{- end }}
          {{- /* LAST in envFrom, deliberately: envFrom is later-source-wins, so these must
                 follow app_env/silo_env/live_env. Those may carry their own copy of a key a
                 group hook owns, and first would let the stale copy win on one workload but
                 not another -- the app and live copies of LIVE_SERVER_SECRET_KEY must agree
                 or live-server auth fails with nothing logged. */}}
          {{- include "plane.appKeysSecretRef" . }}
        {{- if or .Values.extraEnv (eq (include "plane.otel.enabled" .) "true") (include "plane.infraCredsEnv" .) }}
        env:
          {{- with (include "plane.otel.serviceEnv" (dict "ctx" $ "service" "outbox-poller")) }}{{ . | nindent 10 }}{{- end }}
          {{- with (include "plane.infraCredsEnv" .) }}
{{ trim . | indent 10 }}
          {{- end }}
          {{- if .Values.extraEnv }}
          {{- toYaml .Values.extraEnv | nindent 10 }}
          {{- end }}
        {{- end }}

      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
{{- end }}