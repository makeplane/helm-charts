{{- if .Values.services.email_service.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-email-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local  # Important for email servers
  selector:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-email-app
  ports:
  - name: smtp
    port: 25
    targetPort: 10025
    protocol: TCP
  - name: smtps
    port: 465
    targetPort: 10465
    protocol: TCP
  - name: submission
    port: 587
    targetPort: 10587
    protocol: TCP
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-email-app
  namespace: {{ .Release.Namespace }}
  {{/* The Reloader annotation now comes from plane.labelsAndAnnotations (gated on
       reloader.enabled). It used to be a literal key here, which was silently
       dropped whenever services.email_service.annotations was also set, because the
       helper emits its own `annotations:` key. */}}
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.email_service) }}
spec:
  replicas: {{ .Values.services.email_service.replicas | default 1 }}
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-email-app
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-email-app
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      annotations:
        {{- include "plane.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "plane.podScheduling" .Values.services.email_service }}
      containers:
      - name: {{ .Release.Name }}-email-app
        imagePullPolicy: {{ .Values.services.email_service.pullPolicy | default "Always" }}
        image: {{ .Values.services.email_service.image | default "makeplane/email-commercial" }}:{{ .Values.planeVersion }}
        securityContext:
          runAsUser: 100
        stdin: true
        tty: true
        readinessProbe:
          exec:
            command:
            - nc
            - -zv
            - localhost
            - "10025"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: {{ .Values.services.email_service.memoryRequest | default "50Mi" | quote }}
            cpu: {{ .Values.services.email_service.cpuRequest | default "50m" | quote }}
          limits:
            memory: {{ .Values.services.email_service.memoryLimit  | default "1000Mi" | quote }}
            cpu: {{ .Values.services.email_service.cpuLimit | default "500m" | quote}}
        envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-email-vars
              optional: false
        {{- if .Values.extraEnv }}
        env:
          {{- toYaml .Values.extraEnv | nindent 10 }}
        {{- end }}
        volumeMounts:
          - name: tls-cert
            mountPath: /opt/email/keys
          - name: spam-blacklist
            mountPath: /opt/email/spam.txt
            subPath: spam.txt
          - name: spam-blacklist
            mountPath: /opt/email/domain-blacklist.txt
            subPath: domain-blacklist.txt
      volumes:
        - name: spam-blacklist
          configMap:
            name: {{ .Release.Name }}-email-vars
        - name: tls-cert
          secret:
            secretName: {{ .Release.Name }}-mail-tls-secret
            items:
            - key: tls.crt
              path: cert.pem
            - key: tls.key
              path: key.pem
            optional: false
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
---
{{- end }}