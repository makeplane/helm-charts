{{- if .Values.services.email_service.enabled }}
{{- /* services.email_service.service shapes the Service. Every key falls back to the
       pre-3.11.3 behaviour (a LoadBalancer with externalTrafficPolicy Local), also
       when the block is missing entirely, as after `helm upgrade --reuse-values`. */}}
{{- $svc := .Values.services.email_service.service | default dict }}
{{- $svcType := $svc.type | default "LoadBalancer" }}
{{- if not (has $svcType (list "ClusterIP" "NodePort" "LoadBalancer")) }}
{{- fail (printf "services.email_service.service.type must be ClusterIP, NodePort or LoadBalancer, got %q" $svcType) }}
{{- end }}
{{- $exposed := has $svcType (list "NodePort" "LoadBalancer") }}
{{- $nodePorts := $svc.nodePorts | default dict }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-email-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svcType }}
  {{- if $exposed }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy | default "Local" }}  # Important for email servers
  {{- end }}
  {{- if eq $svcType "LoadBalancer" }}
  {{- /* spec.loadBalancerClass is immutable once the LoadBalancer Service exists, so
         changing it fails the upgrade; values.yaml documents the ClusterIP round-trip. */}}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-email-app
  ports:
  - name: smtp
    port: 25
    targetPort: 10025
    {{- if and $exposed $nodePorts.smtp }}
    nodePort: {{ $nodePorts.smtp }}
    {{- end }}
    protocol: TCP
  - name: smtps
    port: 465
    targetPort: 10465
    {{- if and $exposed $nodePorts.smtps }}
    nodePort: {{ $nodePorts.smtps }}
    {{- end }}
    protocol: TCP
  - name: submission
    port: 587
    targetPort: 10587
    {{- if and $exposed $nodePorts.submission }}
    nodePort: {{ $nodePorts.submission }}
    {{- end }}
    protocol: TCP
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-email-app
  namespace: {{ .Release.Namespace }}
  {{/* Annotations come from services.email_service.annotations via the helper. A Reloader
       annotation used to be a literal key here, which was silently dropped whenever that
       value was also set, because the helper emits its own `annotations:` key. */}}
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.email_service) }}
spec:
  replicas: {{ .Values.services.email_service.replicas | default 1 }}
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-email-app
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-email-app
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      annotations:
        {{- include "plane.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "plane.podScheduling" .Values.services.email_service }}
      {{- include "plane.podSpread" (dict "svc" .Values.services.email_service "app" "email-app" "root" .) }}
      containers:
      - name: {{ .Release.Name }}-email-app
        imagePullPolicy: {{ .Values.services.email_service.pullPolicy | default "Always" }}
        image: {{ .Values.services.email_service.image | default "makeplane/email-commercial" }}:{{ .Values.planeVersion }}
        {{- /* The email image's app-user really is uid 100 and owns /opt/email, so
             this service pins its own UID instead of taking runAsUser from the
             shared block. It still takes everything else from that block when
             securityContext.enabled is set -- runAsNonRoot, dropped capabilities
             and seccompProfile are not UID-specific, and omitting them would
             leave this the one unhardened workload. Set
             services.email_service.runAsUser to null on platforms that assign the
             UID themselves (OpenShift's restricted-v2 SCC rejects any runAsUser
             outside the namespace's range). */}}
        {{- $emailCtx := dict }}
        {{- if .Values.securityContext.enabled }}
        {{- $emailCtx = omit .Values.securityContext.containerSecurityContext "runAsUser" }}
        {{- end }}
        {{- with .Values.services.email_service.runAsUser }}
        {{- $emailCtx = merge (dict "runAsUser" .) $emailCtx }}
        {{- end }}
        {{- with $emailCtx }}
        securityContext: {{- toYaml . | nindent 10 }}
        {{- end }}
        stdin: true
        tty: true
        readinessProbe:
          exec:
            command:
            - nc
            - -zv
            - localhost
            - "10025"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: {{ .Values.services.email_service.memoryRequest | default "128Mi" | quote }}
            cpu: {{ .Values.services.email_service.cpuRequest | default "100m" | quote }}
          limits:
            memory: {{ .Values.services.email_service.memoryLimit  | default "1000Mi" | quote }}
            cpu: {{ .Values.services.email_service.cpuLimit | default "500m" | quote}}
        envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-email-vars
              optional: false
        {{- if .Values.extraEnv }}
        env:
          {{- toYaml .Values.extraEnv | nindent 10 }}
        {{- end }}
        volumeMounts:
          - name: tls-cert
            mountPath: /opt/email/keys
          - name: spam-blacklist
            mountPath: /opt/email/spam.txt
            subPath: spam.txt
          - name: spam-blacklist
            mountPath: /opt/email/domain-blacklist.txt
            subPath: domain-blacklist.txt
      volumes:
        - name: spam-blacklist
          configMap:
            name: {{ .Release.Name }}-email-vars
        {{- /* With no Secret to mount, an emptyDir: the app writes a self-signed
               keys/cert.pem + key.pem at startup when they are missing
               (plane-ee apps/email/pkg/utils/certs.go). */}}
        {{- $tlsSecret := include "plane.emailTlsSecretName" . }}
        - name: tls-cert
          {{- if $tlsSecret }}
          secret:
            secretName: {{ $tlsSecret }}
            items:
            - key: tls.crt
              path: cert.pem
            - key: tls.key
              path: key.pem
            optional: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
---
{{- end }}