
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-live
  labels:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-live
    {{- include "plane.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  {{- if not .Values.services.live.assign_cluster_ip }}
  clusterIP: None
  {{- end }}
  ports:
  - name: live-3000
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-live

---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-live-wl
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.live) }}
spec:
  replicas: {{ .Values.services.live.replicas | default 1}}
  {{- include "plane.rollingUpdateStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-live
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-live
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      annotations:
        {{- include "plane.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "plane.podScheduling" .Values.services.live }}
      {{- include "plane.podSecurityContext" . }}
      {{- with (include "plane.s3CANodeVolumes" .) }}
{{ . | indent 6 }}
      {{- end }}
      {{- if include "plane.s3CAEnabled" . }}
      initContainers:
      - name: prepare-ca-bundle
        image: busybox
        {{- include "plane.containerSecurityContext" . }}
        command:
          - /bin/sh
          - -c
          - |
            set -e
            echo "Preparing custom CA bundle for Node.js..."
            if [ "$(ls -A /s3-custom-ca)" ]; then
              cat /s3-custom-ca/* > /ca-bundle/custom-ca-bundle.crt
              echo "CA bundle created at /ca-bundle/custom-ca-bundle.crt"
            else
              echo "No custom CA certificates found, creating empty bundle"
              touch /ca-bundle/custom-ca-bundle.crt
            fi
        volumeMounts:
          - name: s3-custom-ca
            mountPath: /s3-custom-ca
            readOnly: true
          - name: ca-bundle
            mountPath: /ca-bundle
      {{- end }}
      containers:
      - name: {{ .Release.Name }}-live
        {{- include "plane.containerSecurityContext" . }}
        imagePullPolicy: {{ .Values.services.live.pullPolicy | default "Always" }}
        image: {{ .Values.services.live.image | default "makeplane/live-commercial" }}:{{ .Values.planeVersion }}
        stdin: true
        tty: true
        resources:
          requests:
            memory: {{ .Values.services.live.memoryRequest | default "512Mi" | quote }}
            cpu: {{ .Values.services.live.cpuRequest | default "100m" | quote }}
          limits:
            memory: {{ .Values.services.live.memoryLimit  | default "2000Mi" | quote }}
            cpu: {{ .Values.services.live.cpuLimit | default "500m" | quote}}
        {{- with (include "plane.s3CANodeBundleMount" .) }}
{{ . | indent 8 }}
        {{- end }}
        envFrom:
          {{- include "plane.appKeysSecretRef" . }}
          {{- include "plane.aiProvidersSecretRef" . }}
          - configMapRef:
              name: {{ .Release.Name }}-live-vars
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.live_env_existingSecret) }}{{ .Values.external_secrets.live_env_existingSecret }}{{ else }}{{ .Release.Name }}-live-secrets{{ end }}
              optional: false
          {{- with (include "plane.otel.envFrom" $) }}{{ . | nindent 10 }}{{- end }}
        {{- if or .Values.extraEnv (include "plane.s3CAEnabled" .) (include "plane.redisCredsEnv" .) (include "plane.rabbitmqCredsEnv" .) (eq (include "plane.otel.enabled" .) "true") }}
        env:
          {{- with (include "plane.s3CANodeEnvVars" .) }}
{{ . | indent 10 }}
          {{- end }}
          {{/* live reads the broker as discrete parts from the release that added
               composeAmqpUrlFromParts(); before that it read only AMQP_URL, so the mirror
               reached every service except this one and only exports failed. */}}
          {{- with (include "plane.rabbitmqCredsEnv" .) }}
{{ trim . | indent 10 }}
          {{- end }}
          {{- with (include "plane.redisCredsEnv" .) }}
{{ trim . | indent 10 }}
          {{- end }}
          {{- with (include "plane.otel.serviceEnv" (dict "ctx" $ "service" "live")) }}{{ . | nindent 10 }}{{- end }}
          {{- if .Values.extraEnv }}
          {{- toYaml .Values.extraEnv | nindent 10 }}
          {{- end }}
        {{- end }}
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
---
