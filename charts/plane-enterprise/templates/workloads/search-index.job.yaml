{{/*
Creates Plane's OpenSearch indexes that do not exist yet.

Plane never creates them itself (not at startup, not in a migration), and a missing
index makes workspace search answer HTTP 500. `manage_search_index index create`
is not usable here: django-opensearch-dsl 0.7.0 calls index.create() for every
registered index and exits 1 on the first resource_already_exists, so it fails on
every upgrade after the first. This Job creates only the missing ones, then the
docs_semantic index through plane.ee.documents.entities.plane_docs.sync_index
("create"), which already skips an existing index. Index names come from the
app's settings, so OPENSEARCH_INDEX_PREFIX applies as it does for the api.

Mapping changes of existing indexes (update / rebuild) stay manual -- see
`manage_search_index index update|rebuild` in the README.

A post-install/post-upgrade hook, because the migrator is a plain Job: the pod
waits for the database and for migrations itself (wait_for_db,
wait_for_migrations -- the same pair the worker entrypoints run), then waits a
bounded time for OpenSearch to answer, since the bundled cluster
(services.opensearch.local_setup) may still be starting. Any other OpenSearch
error (403, bad request, TLS) fails the Job, and with it the release.

Rendered when services.api.searchIndexJob.enabled (a missing key counts as
enabled, an explicit false does not) and OpenSearch can be on: the bundled
cluster, env.opensearch_remote_url, or a user-supplied
external_secrets.opensearch_existingSecret. In that last case the Secret decides,
and the Job exits 0 without touching anything when OPENSEARCH_ENABLED is not 1.
*/}}
{{- $sij := .Values.services.api.searchIndexJob | default dict }}
{{- $enabled := true }}
{{- if hasKey $sij "enabled" }}
{{- $enabled = $sij.enabled }}
{{- end }}
{{- $opensearchOn := or .Values.services.opensearch.local_setup .Values.env.opensearch_remote_url .Values.external_secrets.opensearch_existingSecret }}
{{- if and $enabled $opensearchOn }}
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-api-search-index
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  {{- /* Covers the wait for migrations, which on a fresh install can take well over
         ten minutes: wait_for_migrations itself polls every 10s with no limit. */}}
  activeDeadlineSeconds: {{ $sij.activeDeadlineSeconds | default 3600 }}
  template:
    metadata:
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-api-search-index
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      annotations:
        {{- include "plane.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "plane.podScheduling" .Values.services.api }}
      {{- include "plane.podSecurityContext" . }}
      {{- with (include "plane.s3CAVolumes" .) }}
{{ . | indent 6 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}-api-search-index
        {{- include "plane.containerSecurityContext" . }}
        image: {{ .Values.services.api.image | default "makeplane/backend-commercial" }}:{{ .Values.planeVersion }}
        imagePullPolicy: {{ .Values.services.api.pullPolicy | default "Always" }}
        resources:
          requests:
            memory: {{ .Values.services.api.memoryRequest | default "512Mi" | quote }}
            cpu: {{ .Values.services.api.cpuRequest | default "200m" | quote }}
          limits:
            memory: {{ .Values.services.api.memoryLimit  | default "2Gi" | quote }}
            cpu: {{ .Values.services.api.cpuLimit | default "1000m" | quote}}
        {{- with (include "plane.s3CAVolumeMounts" .) }}
{{ . | indent 8 }}
        {{- end }}
        command:
          - /bin/bash
          - -c
          - |
            set -e
            {{- with (include "plane.s3CAInitScript" .) }}
{{ . | indent 12 }}
            {{- end }}

            python manage.py wait_for_db
            python manage.py wait_for_migrations

            python manage.py shell -c "$(cat <<'PY'
            import sys
            import time

            from django.conf import settings

            if not getattr(settings, "OPENSEARCH_ENABLED", False):
                print("search-index: OPENSEARCH_ENABLED is not 1, nothing to do")
                sys.exit(0)

            from django_opensearch_dsl.registries import registry
            from opensearchpy.exceptions import ConnectionError as OSConnectionError
            from opensearchpy.exceptions import RequestError, SSLError, TransportError

            from plane.ee.documents.entities.plane_docs import sync_index

            ATTEMPTS, DELAY = 60, 10


            def retry(fn, what):
                # Retry only while OpenSearch is unreachable or still starting
                # (connection errors, 502/503/504). Anything else -- 403, 400, a TLS
                # failure -- is raised at once and fails the Job.
                for attempt in range(1, ATTEMPTS + 1):
                    try:
                        return fn()
                    except SSLError:
                        raise
                    except OSConnectionError as e:
                        err = e
                    except TransportError as e:
                        if e.status_code not in (502, 503, 504):
                            raise
                        err = e
                    print(f"search-index: OpenSearch not ready ({what}: {err}), retry {attempt}/{ATTEMPTS} in {DELAY}s", flush=True)
                    time.sleep(DELAY)
                sys.exit(f"search-index: OpenSearch did not answer after {ATTEMPTS} attempts")


            created, existing = [], []
            for index in sorted(registry.get_indices(), key=lambda i: i._name):
                name = index._name
                if retry(index.exists, name):
                    existing.append(name)
                    continue
                try:
                    retry(index.create, name)
                    created.append(name)
                except RequestError as e:
                    if e.error != "resource_already_exists_exception":
                        raise
                    existing.append(name)

            print(f"search-index: created {created or 'none'}; already present {existing or 'none'}", flush=True)
            retry(lambda: sync_index("create"), "docs_semantic")
            PY
            )"
        envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-app-vars
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.app_env_existingSecret) }}{{ .Values.external_secrets.app_env_existingSecret }}{{ else }}{{ .Release.Name }}-app-secrets{{ end }}
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.doc_store_existingSecret) }}{{ .Values.external_secrets.doc_store_existingSecret }}{{ else }}{{ .Release.Name }}-doc-store-secrets{{ end }}
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.opensearch_existingSecret) }}{{ .Values.external_secrets.opensearch_existingSecret }}{{ else }}{{ .Release.Name }}-opensearch-secrets{{ end }}
              optional: false
          {{- if .Values.services.silo.enabled }}
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.silo_env_existingSecret) }}{{ .Values.external_secrets.silo_env_existingSecret }}{{ else }}{{ .Release.Name }}-silo-secrets{{ end }}
              optional: false
          {{- end }}
          {{- if .Values.services.runner.enabled }}
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.runner_env_existingSecret) }}{{ .Values.external_secrets.runner_env_existingSecret }}{{ else }}{{ .Release.Name }}-runner-secrets{{ end }}
              optional: false
          {{- end }}
          {{- /* LAST in envFrom, as in the migrator: later sources win. */}}
          {{- include "plane.appKeysSecretRef" . }}
          {{- include "plane.siloConnectorsSecretRef" . }}
        {{- if or .Values.extraEnv (include "plane.s3CAEnabled" .) (include "plane.infraCredsEnv" .) }}
        env:
          {{- with (include "plane.s3CAEnvVars" .) }}
{{ . | indent 10 }}
          {{- end }}
          {{- with (include "plane.infraCredsEnv" .) }}
{{ trim . | indent 10 }}
          {{- end }}
          {{- if .Values.extraEnv }}
          {{- toYaml .Values.extraEnv | nindent 10 }}
          {{- end }}
        {{- end }}
      restartPolicy: Never
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
---
{{- end }}
