
{{- if .Values.services.live_exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-live-exporter-wl
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.live_exporter) }}
spec:
  replicas: {{ .Values.services.live_exporter.replicas | default 1 }}
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-live-exporter
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-live-exporter
        {{- include "plane.commonLabels" $ | nindent 8 }}
        {{- include "plane.serviceAccountPodLabels" . }}
      annotations:
        {{- include "plane.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "plane.podScheduling" .Values.services.live_exporter }}
      {{- include "plane.podSpread" (dict "svc" .Values.services.live_exporter "app" "live-exporter" "root" .) }}
      {{- include "plane.podSecurityContext" . }}
      {{- with (include "plane.s3CANodeVolumes" .) }}
{{ . | indent 6 }}
      {{- end }}
      {{- /* Same CA bundle as live: the exporter shares live's Redis and storage clients. */}}
      {{- if include "plane.s3CAEnabled" . }}
      initContainers:
      - name: prepare-ca-bundle
        image: {{ .Values.services.live.init_image | default "busybox" }}
        {{- include "plane.containerSecurityContext" . }}
        command:
          - /bin/sh
          - -c
          - |
            set -e
            echo "Preparing custom CA bundle for Node.js..."
            if [ "$(ls -A /s3-custom-ca)" ]; then
              for f in /s3-custom-ca/*; do cat "$f"; echo; done > /ca-bundle/custom-ca-bundle.crt
              echo "CA bundle created at /ca-bundle/custom-ca-bundle.crt"
            else
              echo "No custom CA certificates found, creating empty bundle"
              touch /ca-bundle/custom-ca-bundle.crt
            fi
        volumeMounts:
          - name: s3-custom-ca
            mountPath: /s3-custom-ca
            readOnly: true
          - name: ca-bundle
            mountPath: /ca-bundle
      {{- end }}
      containers:
      - name: {{ .Release.Name }}-live-exporter
        {{- include "plane.containerSecurityContext" . }}
        imagePullPolicy: {{ .Values.services.live_exporter.pullPolicy | default "Always" }}
        image: {{ .Values.services.live_exporter.image | default "makeplane/live-commercial" }}:{{ .Values.planeVersion }}
        stdin: true
        tty: true
        resources:
          requests:
            memory: {{ .Values.services.live_exporter.memoryRequest | default "256Mi" | quote }}
            cpu: {{ .Values.services.live_exporter.cpuRequest | default "100m" | quote }}
          limits:
            memory: {{ .Values.services.live_exporter.memoryLimit | default "2000Mi" | quote }}
            cpu: {{ .Values.services.live_exporter.cpuLimit | default "1000m" | quote }}
        {{- with (include "plane.s3CANodeBundleMount" .) }}
{{ . | indent 8 }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-live-vars
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.live_env_existingSecret) }}{{ .Values.external_secrets.live_env_existingSecret }}{{ else }}{{ .Release.Name }}-live-secrets{{ end }}
              optional: false
          {{- with (include "plane.otel.envFrom" $) }}{{ . | nindent 10 }}{{- end }}
          {{- /* Same image and env check as live, which exits without LIVE_SERVER_SECRET_KEY;
                 with app_keys set the live Secret no longer carries it. Last, as on live. */}}
          {{- include "plane.appKeysSecretRef" . }}
        env:
          - name: LIVE_MODE
            value: "exporter"
          {{- with (include "plane.s3CANodeEnvVars" .) }}
{{ . | indent 10 }}
          {{- end }}
          {{/* The export worker is the whole reason the broker credential matters here, and it
               had no credential helper at all — it inherited whatever AMQP_URL the live Secret
               carried, which the mirror blanks on purpose. Redis comes too: the exporter shares
               live's RedisManager for job state. */}}
          {{- with (include "plane.rabbitmqCredsEnv" .) }}
{{ trim . | indent 10 }}
          {{- end }}
          {{- with (include "plane.redisCredsEnv" .) }}
{{ trim . | indent 10 }}
          {{- end }}
          {{- with (include "plane.otel.serviceEnv" (dict "ctx" $ "service" "live-exporter")) }}{{ . | nindent 10 }}{{- end }}
          {{- if .Values.extraEnv }}
          {{- toYaml .Values.extraEnv | nindent 10 }}
          {{- end }}
      serviceAccount: {{ include "plane.serviceAccountName" . }}
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
{{- end }}
