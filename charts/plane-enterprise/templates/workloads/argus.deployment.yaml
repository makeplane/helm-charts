{{- if .Values.services.argus.enabled }}

apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-argus
  labels:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-argus
    {{- include "plane.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  {{- if not .Values.services.argus.assign_cluster_ip }}
  clusterIP: None
  {{- end }}
  ports:
  - name: argus-8100
    port: 8100
    protocol: TCP
    targetPort: 8100
  selector:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-argus

---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-argus-wl
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.services.argus) }}
spec:
  {{- /* Argus is deliberately single-instance and NOT horizontally scalable:

         1. Findings-export CSVs are generated by an in-process goroutine onto the
            pod's own filesystem (ARGUS_DATA_DIR/exports/<id>.csv) and the download
            is served from that same local path. A second replica would 404 every
            download routed to the pod that did not generate the file.
         2. Both startup reapers are unscoped -- ReapInterruptedExports fails EVERY
            export in `running` and ReapInterruptedScanRuns re-queues EVERY scan in
            `running`/`pausing`, with no owner predicate. A second pod starting up
            therefore sabotages the first pod's in-flight work.

         Hence replicas: 1 with strategy Recreate (RollingUpdate's maxSurge would
         briefly overlap two pods and trip reason 2 on every upgrade), and no
         `replicas` value to override. */}}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-argus
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-argus
        {{- include "plane.commonLabels" $ | nindent 8 }}
      annotations:
        timestamp: {{ now | quote }}
    spec:
      {{- include "plane.podScheduling" .Values.services.argus }}
      {{- include "plane.podSecurityContext" . }}
      {{- /* On SIGTERM Argus drains in-flight scan workers first and only then
             starts a 10s HTTP drain, so the 30s default can cut the shutdown
             short mid-scan. */}}
      terminationGracePeriodSeconds: {{ .Values.services.argus.termination_grace_period_seconds | default 60 }}
      containers:
      - name: {{ .Release.Name }}-argus
        {{- include "plane.containerSecurityContext" . }}
        imagePullPolicy: {{ .Values.services.argus.pullPolicy | default "Always" }}
        image: {{ .Values.services.argus.image | default "makeplane/argus-commercial" }}:{{ .Values.planeVersion }}
        stdin: true
        tty: true
        ports:
          - containerPort: 8100
        resources:
          requests:
            memory: {{ .Values.services.argus.memoryRequest | default "250Mi" | quote }}
            cpu: {{ .Values.services.argus.cpuRequest | default "50m" | quote }}
          limits:
            memory: {{ .Values.services.argus.memoryLimit | default "1000Mi" | quote }}
            cpu: {{ .Values.services.argus.cpuLimit | default "500m" | quote }}
        {{- /* /healthz is the only health route and it is mounted under
               ARGUS_BASE_PATH -- the unprefixed path 404s. It is a static 200 and
               does not touch the database; DB reachability is verified once at
               startup, where failure aborts the process before it listens. */}}
        startupProbe:
          httpGet:
            path: {{ trimSuffix "/" .Values.env.argus_envs.base_path }}/healthz
            port: 8100
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: {{ trimSuffix "/" .Values.env.argus_envs.base_path }}/healthz
            port: 8100
            scheme: HTTP
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ trimSuffix "/" .Values.env.argus_envs.base_path }}/healthz
            port: 8100
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-argus-vars
              optional: false
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.argus_env_existingSecret) }}{{ .Values.external_secrets.argus_env_existingSecret }}{{ else }}{{ .Release.Name }}-argus-secrets{{ end }}
              optional: false
        {{- if .Values.extraEnv }}
        env:
          {{- toYaml .Values.extraEnv | nindent 10 }}
        {{- end }}
        volumeMounts:
          - name: argus-data
            mountPath: {{ .Values.env.argus_envs.data_dir | default "/home/nonroot/data" | quote }}
      {{- /* Writable data dir for findings-export CSVs. The image ships it owned by
             its own uid (65532 distroless, 1000 FIPS), which breaks as soon as
             securityContext pins a different UID or OpenShift assigns one; an
             emptyDir is writable by any UID. Exports are ephemeral by design
             (their download tokens expire after 15 minutes), so nothing is lost
             on restart. */}}
      volumes:
        - name: argus-data
          emptyDir: {}
      serviceAccount: {{ .Release.Name }}-srv-account
      serviceAccountName: {{ .Release.Name }}-srv-account
---
{{- end }}
