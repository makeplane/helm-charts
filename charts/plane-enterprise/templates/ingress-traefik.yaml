{{- if and .Values.ingress.enabled (eq (include "plane.ingressController" .) "traefik") .Values.license.licenseDomain }}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    {{- include "plane.traefikEntryPoints" . | nindent 4 }}

  routes:

  # IMPORTANT: specific paths FIRST

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/spaces/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-space
        port: 3000

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/god-mode/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-admin
        port: 3000

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/api/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-api
        port: 8000

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/auth/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-api
        port: 8000

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/graphql/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-api
        port: 8000

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/marketplace/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-api
        port: 8000

  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/live/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-live
        port: 3000

  {{- if .Values.services.silo.enabled }}
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/silo/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-silo
        port: 3000
  {{- end }}

  {{- /* PathPrefix does not strip the prefix -- Argus serves every route under
         ARGUS_BASE_PATH, which must equal the web build's VITE_ARGUS_BASE_PATH. */}}
  {{- if .Values.services.argus.enabled }}
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`{{ trimSuffix "/" .Values.env.argus_envs.base_path }}/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-argus
        port: 8100
  {{- end }}

  {{- if .Values.services.pi.enabled }}
  # File uploads in pi: keep the body-size limit (more specific path matches first)
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/pi/api/v1/attachments/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-pi-api
        port: 8000
  # Everything else in pi (incl. streaming/SSE): no buffering middleware
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/pi/`)
    kind: Rule
    services:
      - name: {{ .Release.Name }}-pi-api
        port: 8000
  {{- end }}

  {{- if .Values.services.mcp_server.enabled }}
  {{- $mcpPrefix := .Values.services.mcp_server.path_prefix | default "/mcp" | trimSuffix "/" }}
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`{{ $mcpPrefix }}/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-mcp-server
        port: 8211
  {{- /* OAuth discovery (RFC 9728 / RFC 8414) is path-inserted at the ROOT of the host:
         /.well-known/oauth-protected-resource<prefix>/http/mcp and
         /.well-known/oauth-authorization-server<prefix>/http. The MCP server serves them
         itself and advertises the first in its WWW-Authenticate header, so they must
         reach it rather than the web app. Plane serves nothing under /.well-known. */}}
  - match: Host(`{{ .Values.license.licenseDomain }}`) && (PathPrefix(`/.well-known/oauth-protected-resource{{ $mcpPrefix }}`) || PathPrefix(`/.well-known/oauth-authorization-server{{ $mcpPrefix }}`))
    kind: Rule
    services:
      - name: {{ .Release.Name }}-mcp-server
        port: 8211
  {{- end }}

  {{- if and (eq (include "plane.minioEnabled" .) "true") .Values.env.docstore_bucket }}
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/{{ .Values.env.docstore_bucket }}`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-minio
        port: 9000
  {{- end }}

  {{- /* makeplane/drawio serves its webapp at "/", so the /drawio prefix is stripped
         before forwarding. */}}
  {{- if .Values.services.drawio.local_setup }}
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/drawio/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-drawio-stripprefix
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-drawio
        port: 8080
  {{- end }}

  # LAST: catch all
  - match: Host(`{{ .Values.license.licenseDomain }}`) && PathPrefix(`/`)
    kind: Rule
    middlewares:
      - name: {{ .Release.Name }}-body-limit
    services:
      - name: {{ .Release.Name }}-web
        port: 3000

  {{- if eq (include "plane.chartManagedCert" .) "true" }}
  tls:
    secretName: {{ default (printf "%s-ssl-cert" .Release.Name) .Values.ssl.tls_secret_name }}
  {{- end }}

{{- end }}
