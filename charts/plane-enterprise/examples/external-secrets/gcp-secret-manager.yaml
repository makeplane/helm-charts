# External Secrets Operator -> GCP Secret Manager, for the plane-enterprise chart.
#
# Replace: NAMESPACE, PROJECT_ID, the GKE clusterLocation/clusterName in the
# SecretStore below, and the secret names.
#
# Authentication uses GKE Workload Identity on the External Secrets Operator's own
# ServiceAccount — no static keys. The bound Google service account needs
# roles/secretmanager.secretAccessor on the secrets referenced below.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: NAMESPACE
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: plane
          serviceAccountRef:
            # ESO's ServiceAccount, annotated with iam.gke.io/gcp-service-account
            name: external-secrets
            namespace: external-secrets
---
# 1. DATABASE (CloudSQL) — mirror the credential secret verbatim.
#
# Store the secret in Secret Manager as JSON so extract can split it into keys:
#   {"username": "plane", "password": "..."}
# Nothing here needs changing when the password rotates — only the secret version does.
#
# Chart side:
#   external_secrets.database.secretName: plane-cloudsql
#   external_secrets.database.usernameKey: username
#   external_secrets.database.passwordKey: password
#   env.pgdb_host: 10.x.x.x   (private IP, or 127.0.0.1 with the auth proxy)
#   env.pgdb_name: plane
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-cloudsql
  namespace: NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: plane-cloudsql
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: plane-cloudsql   # JSON: {"username": "...", "password": "..."}
---
# 2. RABBITMQ — a self-managed or third-party broker on GCP.
#
# Chart side:
#   external_secrets.rabbitmq.secretName: plane-rabbitmq
#   env.rabbitmq_host / rabbitmq_port / rabbitmq_vhost
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-rabbitmq
  namespace: NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: plane-rabbitmq
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: plane-rabbitmq   # JSON: {"username": "...", "password": "..."}
---
# 3. REDIS (Memorystore AUTH string).
#
# Memorystore stores the AUTH string as a plain value rather than JSON, so map it to a
# single key with `data` instead of extracting.
#
# Chart side (needs planeVersion v3.1.0+):
#   external_secrets.redis.secretName: plane-memorystore
#   external_secrets.redis.passwordKey: password
#   env.redis_host, env.redis_ssl: true   (true when in-transit encryption is on)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-memorystore
  namespace: NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: plane-memorystore
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: plane-memorystore-auth
---
# 4. SHARED SIGNING KEYS — external_secrets.app_keys_existingSecret: plane-app-keys
#
# NEVER rotate this secret: SECRET_KEY and AES_SECRET_KEY/AES_SALT are key-encryption
# keys, and changing them makes existing ciphertext undecryptable, silently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-app-keys
  namespace: NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: plane-app-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        # JSON holding SECRET_KEY, AES_SECRET_KEY, AES_SALT,
        # LIVE_SERVER_SECRET_KEY, PI_INTERNAL_SECRET, SILO_HMAC_SECRET_KEY,
        # CURSOR_WEBHOOK_SECRET
        key: plane-app-keys
---
# 5. OBJECT STORAGE — prefer no secret at all.
#
# With GKE Workload Identity, leave env.gcs_credentials_json empty and annotate the
# chart's ServiceAccount; the API then uses Application Default Credentials:
#
#   serviceAccount:
#     annotations:
#       iam.gke.io/gcp-service-account: plane@PROJECT_ID.iam.gserviceaccount.com
#   env:
#     storage_provider: GCS
#     gcs_bucket_name: plane-uploads
#     gcs_project_id: PROJECT_ID
#     use_storage_proxy: true       # browser uploads proxied; bucket needs no CORS
#
# Only if you cannot use Workload Identity, deliver a service-account key through
# doc_store_existingSecret with a GCS_CREDENTIALS_JSON key. That Secret replaces the
# chart's doc-store Secret entirely, so it must also carry STORAGE_PROVIDER,
# GCS_BUCKET_NAME, USE_MINIO ("0"), AWS_S3_BUCKET_NAME and FILE_SIZE_LIMIT.
---
# 6. SILO / LIVE / PLANE AI — these read a connection URL, not discrete parts, so ESO
# composes the DSN here. urlEncode matters: a generated password containing @ : / #
# would otherwise break the URL.
#
# Chart side: external_secrets.silo_env_existingSecret: plane-silo-env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-silo-env
  namespace: NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: plane-silo-env
    creationPolicy: Owner
    template:
      engine: v2
      data:
        DATABASE_URL: 'postgresql://{{ .username }}:{{ .password | urlEncode }}@10.0.0.3:5432/plane?sslmode=require'
        REDIS_URL: 'rediss://:{{ .redis_password | urlEncode }}@10.0.0.4:6378'
        AMQP_URL: 'amqp://{{ .mq_username }}:{{ .mq_password | urlEncode }}@rabbitmq.internal:5672/'
  data:
    - secretKey: username
      remoteRef: { key: plane-cloudsql, property: username }
    - secretKey: password
      remoteRef: { key: plane-cloudsql, property: password }
    - secretKey: redis_password
      remoteRef: { key: plane-memorystore-auth }
    - secretKey: mq_username
      remoteRef: { key: plane-rabbitmq, property: username }
    - secretKey: mq_password
      remoteRef: { key: plane-rabbitmq, property: password }
