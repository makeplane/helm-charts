# Redis Sentinel (bring your own) with plain values: passwords land in each
# service's own Secret.
# Turn on every workload that talks to Redis, so the render-and-assert script
# (ci/render-test.sh) sees all of them.
services:
  external_api: {enabled: true}
  worker_importers: {enabled: true}
  outbox_poller: {enabled: true}
  automation_consumer: {enabled: true}
  webhook_consumer: {enabled: true}
  agent_consumer: {enabled: true}
  pi: {enabled: true}
  mcp_server:
    enabled: true
    plane_oauth: {client_id: ci-client-id, client_secret: ci-client-secret}
  redis: {local_setup: false}
env:
  opensearch_remote_url: https://search.example.com   # renders the search-index Job
  redis_sentinels: "sentinel-0.example.com:26379,sentinel-1.example.com:26379,sentinel-2.example.com"
  redis_sentinel_master: mymaster
  redis_sentinel_username: sentinel-user
  redis_sentinel_password: ci-sentinel-password
  redis_username: plane
  redis_password: ci-redis-password
  redis_db: '2'
  redis_ssl: true
  redis_sentinel_ssl: false
  redis_ssl_verify: true
