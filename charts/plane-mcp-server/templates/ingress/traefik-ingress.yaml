{{- if and .Values.ingress.enabled .Values.ingress.host (eq .Values.ingress.ingressController "traefik") }}

{{- /* No `buffering` Middleware: it holds the whole response until the upstream closes. The MCP
       server answers over SSE -- /sse is a stream that stays open for the session, and
       /http/mcp replies as text/event-stream -- so a buffered route never delivers the SSE
       endpoint event and delays every streamed reply. Traefik has no request-body cap that does
       not also buffer the response, so the host carries none. */}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-ingress
spec:
  entryPoints:
    - {{ if .Values.ingress.ssl.enabled }}websecure{{ else }}web{{ end }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-api
          port: 8211
  {{- if .Values.ingress.ssl.enabled }}
  tls:
    secretName: {{ .Release.Name }}-ssl-cert
  {{- end }}

{{- end }}
