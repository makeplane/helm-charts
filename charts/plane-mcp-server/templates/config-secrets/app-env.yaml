apiVersion: v1
kind: Secret
type: Opaque
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-app-secrets
stringData:
  PLANE_OAUTH_PROVIDER_CLIENT_ID: {{ .Values.services.api.plane_oauth.client_id | quote }}
  PLANE_OAUTH_PROVIDER_CLIENT_SECRET: {{ .Values.services.api.plane_oauth.client_secret | quote }}
  PLANE_OAUTH_PROVIDER_BASE_URL: {{ .Values.services.api.plane_oauth.provider_base_url | quote }}
  MCP_PATH_PREFIX: {{ .Values.services.api.path_prefix | quote }}
  PLANE_BASE_URL: {{ .Values.services.api.plane_base_url | quote }}
  PLANE_INTERNAL_BASE_URL: {{ .Values.services.api.plane_internal_base_url | quote }}
  {{- if .Values.services.valkey.local_setup }}
  {{- $valkeyName := printf "%s-%s" .Release.Name (default "valkey" .Values.valkey.nameOverride) }}
  REDIS_HOST: {{ $valkeyName }}
  REDIS_PORT: "6379"
  {{- if .Values.valkey.auth.enabled }}
  REDIS_PASSWORD: {{ index .Values.valkey.auth.aclUsers "default" "password" | quote }}
  {{- end }}
  {{- else if .Values.services.valkey.remote_ssl }}
  {{- /* TLS goes through a rediss:// URL, not REDIS_SSL: on the host/port path the
         server applies REDIS_SSL to its startup PING only, and the token store itself
         connects in plaintext, sending REDIS_PASSWORD in the clear. The URL carries no
         password, so REDIS_PASSWORD fills it in unencoded. Needs image v0.3.2+, which
         is when REDIS_URL arrived; an older image ignores it and falls back to an
         in-memory store, so refuse to render that rather than lose tokens silently. */}}
  {{- /* Same fallback as the deployment's image line, so an empty tag is judged as
         the image that actually runs. */}}
  {{- $tag := toString (.Values.services.api.tag | default "v0.3.5") }}
  {{- if and (regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+$" $tag) (semverCompare "<0.3.2" (trimPrefix "v" $tag)) }}
  {{- fail (printf "services.valkey.remote_ssl needs services.api.tag v0.3.2 or later (got %s): older images do not encrypt the token-store connection to Redis." $tag) }}
  {{- end }}
  REDIS_URL: {{ printf "rediss://%s:%v/" .Values.services.valkey.remote_host (.Values.services.valkey.remote_port | default 6379) | quote }}
  {{- if .Values.services.valkey.remote_password }}
  REDIS_PASSWORD: {{ .Values.services.valkey.remote_password | quote }}
  {{- end }}
  {{- else }}
  REDIS_HOST: {{ .Values.services.valkey.remote_host | quote }}
  REDIS_PORT: {{ .Values.services.valkey.remote_port | default 6379 | quote }}
  {{- if .Values.services.valkey.remote_password }}
  REDIS_PASSWORD: {{ .Values.services.valkey.remote_password | quote }}
  {{- end }}
  {{- end }}