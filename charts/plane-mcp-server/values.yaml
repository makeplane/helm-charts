ingress:
  enabled: true
  host: 'mcp.example.com'
  ingressController: 'traefik' # Allowed: nginx, traefik
  traefik:
    ingressClassName: 'traefik'
    annotations: {}
  nginx:
    ingressClassName: 'nginx'
    annotations: { nginx.ingress.kubernetes.io/proxy-body-size: "10m" }
  ssl:
    enabled: false
    issuer: cloudflare # Allowed : cloudflare, digitalocean, http
    token: '' # not required for http
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com

# When `helm upgrade` restarts pods. Each workload carries checksum/config, a hash of the config
# this chart renders for it, so changing the image tag, the pod spec or that config restarts it and
# an upgrade that changes none of them does not. A new build pushed under the same tag is the one
# thing a hash can't see:
#   auto    (default) also restart on every upgrade when the image tag is not a release version
#           (does not start with 1.2 or v1.2), e.g. latest, stable or a branch tag CI re-pushes
#   always  restart every workload on every upgrade (the behaviour before 1.1.0)
#   never   restart only on a tag, spec or config change
rolloutOnUpgrade: auto

services:
  api:
    image: makeplane/plane-mcp-server
    tag: v0.3.5
    replicas: 1
    memoryLimit: 1000Mi
    cpuLimit: 500m
    memoryRequest: 150Mi
    cpuRequest: 100m
    plane_base_url: ''
    plane_internal_base_url: ''
    path_prefix: '' # HTTP route prefix when mounted behind a proxy (e.g. /plane serves /plane/http/mcp)
    plane_oauth:
      enabled: false
      client_id: ''
      client_secret: ''
      provider_base_url: ''
    labels: {}
    annotations: {}
    tolerations: []
    affinity: {}
    nodeSelector: {}

  valkey:
    local_setup: true
    # remote connection — used when local_setup is false
    remote_host: ''
    remote_port: 6379
    remote_password: ''
    remote_ssl: false

valkey:
  nameOverride: ''
  tolerations: []
  affinity: {}
  nodeSelector: {}
  image:
    repository: valkey/valkey
    tag: '9.1.1'
  replica:
    enabled: false  # standalone mode
  auth:
    enabled: true
    aclUsers:
      default:
        permissions: "~* &* +@all"
        password: 'pleasechangeme'
  dataStorage:
    enabled: true
    className: ''
    requestedSize: '500Mi'
