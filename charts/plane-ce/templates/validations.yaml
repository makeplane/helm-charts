{{- /*
Renders no resource. Holds the checks that must run regardless of which templates are
switched off, so they live here rather than inside a conditional template.

.Release.IsUpgrade is false under helm template, so plain rendering is never blocked --
only helm upgrade and helm upgrade --dry-run.
*/ -}}
{{- $stage := .Values.storage_migration.stage | default "" -}}
{{- $valid := list "no-minio-data" "bulk-sync" "cutover" "rollback" "done" -}}

{{- if and $stage (not (has $stage $valid)) }}
{{- fail (printf "storage_migration.stage must be one of: %s (got %q)." (join ", " $valid) $stage) }}
{{- end }}

{{- /*
The dangerous path: a 3.7.x release whose values never mentioned either store inherits
4.0.0's new defaults and would silently point every service at an EMPTY Garage bucket.
Nothing is deleted, but every existing attachment 404s. There is no in-values signal that
distinguishes that release from a fresh install, so the operator has to name the situation
once; the answer then lives in their values file.
*/ -}}
{{- if and .Release.IsUpgrade (eq (include "plane.garageEnabled" .) "true") (not $stage) }}
{{- fail (printf `
plane-ce 2.0.0 replaces the bundled MinIO with Garage.

This is an UPGRADE and Garage is enabled, but storage_migration.stage is unset,
so the chart cannot tell whether %s-minio still holds objects that have not been copied.
Continuing would point every service at an empty Garage bucket: no data is deleted, but
every existing attachment, avatar and export would 404.

Set storage_migration.stage to one of:

  bulk-sync      This release has data in the bundled MinIO. Keeps the app serving from
                 MinIO, brings Garage up alongside it, and runs a copy Job. Safe to repeat
                 and safe to run under load. START HERE.
  cutover        Bulk sync is green. Points the app at Garage and runs a multi-pass
                 reconcile copy to catch writes made while pods were rolling.
  rollback       Point the app back at MinIO and copy anything written to Garage since
                 cutover back into MinIO.
  done           Cutover is verified. Garage serves everything and no copy Job runs.
  no-minio-data  This release never used the bundled MinIO (external S3 or GCS), or its
                 bucket is empty. Garage starts clean and no copy Job runs.

Full runbook: the 'Migrating from bundled MinIO to Garage' section of the chart README.
` .Release.Name) }}
{{- end }}

{{- /* A copy needs a source that is actually serving. */ -}}
{{- if and (has $stage (list "bulk-sync" "cutover")) (ne (include "plane.minioEnabled" .) "true") (not .Values.storage_migration.source.endpoint) }}
{{- fail (printf "storage_migration.stage=%q needs something to copy FROM, but minio.local_setup is false and storage_migration.source.endpoint is empty. Keep the bundled MinIO deployed until the stage is 'done', or point source.endpoint at the store to copy from." $stage) }}
{{- end }}

{{- if and (eq $stage "rollback") (ne (include "plane.garageEnabled" .) "true") }}
{{- fail "storage_migration.stage=rollback needs Garage deployed to copy back FROM. Keep garage.local_setup=true until the rollback copy has completed." }}
{{- end }}

{{- if and (eq $stage "rollback") (ne (include "plane.minioEnabled" .) "true") }}
{{- fail "storage_migration.stage=rollback needs the bundled MinIO deployed to copy back INTO. Set minio.local_setup=true." }}
{{- end }}
