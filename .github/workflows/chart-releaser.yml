name: Chart Release

on:
  workflow_dispatch: 
    inputs:
      plane-ce:
        description: 'Build Plane CE'
        type: boolean
        default: false
      plane-ee:
        description: 'Build Plane EE'
        type: boolean
        default: false
      plane-mcp-server:
        description: 'Build Plane MCP Server'
        type: boolean
        default: false

env:
  CR_CONFIGFILE: "${{ github.workspace }}/cr.yaml"
  CR_TOOL_PATH: "${{ github.workspace }}/.cr-tool"
  CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GNUPGHOME: ${{ github.workspace }}/.gnupg
  GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  TARGET_BRANCH: "${{ github.ref_name }}"
  CHART_NAME_CE: "plane-ce"
  CHART_NAME_ENTERPRISE: "plane-enterprise"
  CHART_NAME_MCP_SERVER: "plane-mcp-server"
  MARK_AS_LATEST: true
  MARK_AS_PRERELASE: false
  PAGES_INDEX_PATH: ""

jobs:
  setup:
    if: ${{ github.event.inputs.plane-ce == 'true' || github.event.inputs.plane-ee == 'true' || github.event.inputs.plane-mcp-server == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Prepare GPG key #this step is for using exported keys and make your github runner
        env:
          CR_PASSPHRASE_FILE: ${{env.GNUPGHOME}}/gpg-passphrase
        run: |
          gpg --version
          
          mkdir -p ${{env.GNUPGHOME}}
          chmod 700 ${{env.GNUPGHOME}}

          # Disable the use of the gpg-agent
          echo "use-agent" >> ${{env.GNUPGHOME}}/gpg.conf
          echo "pinentry-mode loopback" >> ${{env.GNUPGHOME}}/gpg.conf
          echo "no-tty" >> ${{env.GNUPGHOME}}/gpg.conf
          echo "no-autostart" >> ${{env.GNUPGHOME}}/gpg-agent.conf
          echo "allow-loopback-pinentry" >> ${{env.GNUPGHOME}}/gpg-agent.conf
          echo "${{env.GPG_PASSPHRASE}}" > ${{env.CR_PASSPHRASE_FILE}}
          
          # Import the GPG key
          echo "${{ env.GPG_PRIVATE_KEY }}" | gpg --batch --yes --pinentry-mode loopback --passphrase ${{ env.GPG_PASSPHRASE }} --import

          # Re-create keyring in legacy format for Helm compatibility
          gpg --export-secret-keys --passphrase ${{env.GPG_PASSPHRASE}} > ${{env.GNUPGHOME}}/secring.gpg
          gpg --export --passphrase ${{env.GPG_PASSPHRASE}} > ${{env.GNUPGHOME}}/pubring.gpg

          chmod 400 ${{env.GNUPGHOME}}/secring.gpg

      - name: Remove unwanted charts
        run: |
          if [ "${{ github.event.inputs.plane-ce }}" = "false" ]; then
            rm -rf charts/${{ env.CHART_NAME_CE }}
          fi
          if [ "${{ github.event.inputs.plane-ee }}" = "false" ]; then
            rm -rf charts/${{ env.CHART_NAME_ENTERPRISE }}
          fi
          if [ "${{ github.event.inputs.plane-mcp-server }}" = "false" ]; then
            rm -rf charts/${{ env.CHART_NAME_MCP_SERVER }}
          fi

      - name: Rename Chart
        if: github.ref_name != 'master'
        run: |
          flatBranchName=$(echo "${{ env.TARGET_BRANCH }}" | sed 's/\//\-/g')
          if [ "${{ github.event.inputs.plane-ce }}" = "true" ]; then
            sed -i "s/name: \(.*\)/name: \1-${flatBranchName}/" charts/${{ env.CHART_NAME_CE }}/Chart.yaml
          fi

          if [ "${{ github.event.inputs.plane-ee }}" = "true" ]; then
            sed -i "s/name: \(.*\)/name: \1-${flatBranchName}/" charts/${{ env.CHART_NAME_ENTERPRISE }}/Chart.yaml
          fi

          if [ "${{ github.event.inputs.plane-mcp-server }}" = "true" ]; then
            sed -i "s/name: \(.*\)/name: \1-${flatBranchName}/" charts/${{ env.CHART_NAME_MCP_SERVER }}/Chart.yaml
          fi

          echo "MARK_AS_LATEST=false" >> $GITHUB_ENV
          echo "MARK_AS_PRERELASE=true" >> $GITHUB_ENV
          echo "PAGES_INDEX_PATH=${flatBranchName}" >> $GITHUB_ENV

      - name: Add Helm repos
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Update chart dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}Chart.yaml" ] && grep -q "^dependencies:" "${chart}Chart.yaml" 2>/dev/null; then
              helm dependency update "${chart}"
            fi
          done

      - name: Release Charts
        uses: makeplane/chart-releaser-action@v1.7.0-plane.1
        with:
          charts_dir: charts
          config: cr.yaml
          packages_with_index: false
          skip_existing: true
          mark_as_latest: ${{ env.MARK_AS_LATEST }}
          prerelease: ${{ env.MARK_AS_PRERELASE }}
          pages_index_path: ${{ env.PAGES_INDEX_PATH }}
        env:
          CR_TOKEN: ${{ env.CR_TOKEN }}
          CR_KEY: ${{ env.GPG_KEY_NAME }}
          CR_KEYRING: ${{env.GNUPGHOME}}/secring.gpg
          CR_PASSPHRASE_FILE: ${{env.GNUPGHOME}}/gpg-passphrase
          CR_SIGN: true

  publish:
    if: ${{ github.ref_name == 'master' }}
    needs: setup
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: code

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gh-pages
          path: pages

      - name: Configure Git
        working-directory: pages
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Copy Readme
        run: |
          if [ "${{ github.event.inputs.plane-ce }}" = "true" ]; then
            cp code/charts/plane-ce/README.md pages/content/plane-ce.md
          fi
          if [ "${{ github.event.inputs.plane-ee }}" = "true" ]; then
            cp code/charts/plane-enterprise/README.md pages/content/plane-ee.md
          fi
          if [ "${{ github.event.inputs.plane-mcp-server }}" = "true" ]; then
            cp code/charts/plane-mcp-server/README.md pages/content/plane-mcp-server.md
          fi

      - name: Publish pages
        working-directory: pages
        run: |
          git add .
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            # Commit and push the changes
            git commit -m "Updated READMEs"
            git push
          fi
  


  collect-tags:
    if: ${{ github.ref_name == 'master' }}
    needs: setup
    runs-on: ubuntu-22.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect released chart tags
        id: tags
        run: |
          TAGS=()
          add() {
            name=$(grep '^name:' "charts/$1/Chart.yaml" | sed 's/^name:[[:space:]]*//' | tr -d '\r')
            version=$(grep '^version:' "charts/$1/Chart.yaml" | sed 's/^version:[[:space:]]*//' | tr -d '\r')
            TAGS+=("${name}-${version}")
          }
          [ "${{ github.event.inputs.plane-ce }}" = "true" ] && add ${{ env.CHART_NAME_CE }}
          [ "${{ github.event.inputs.plane-ee }}" = "true" ] && add ${{ env.CHART_NAME_ENTERPRISE }}
          [ "${{ github.event.inputs.plane-mcp-server }}" = "true" ] && add ${{ env.CHART_NAME_MCP_SERVER }}
          echo "tags=$(printf '%s\n' "${TAGS[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  notify:
    needs: collect-tags
    if: ${{ needs.collect-tags.outputs.tags != '[]' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.collect-tags.outputs.tags) }}
    steps:
      - name: Fetch release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "${{ matrix.tag }}" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          # chart-releaser puts the Chart.yaml description above the generated notes; keep only the notes.
          if printf '%s\n' "$BODY" | grep -q "^## What's Changed"; then
            BODY=$(printf '%s\n' "$BODY" | sed -n "/^## What's Changed/,\$p")
          fi
          # Strip HTML comments (e.g. "<!-- Release notes generated using ... -->") so they don't show in Slack
          BODY=$(printf '%s\n' "$BODY" | sed 's/<!--[^>]*-->//g' | sed '/^[[:space:]]*$/d' | sed -z 's/\n$//')
          if [ -z "$BODY" ] || [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Helm chart release **${{ matrix.tag }}** is now available."
          fi
          printf '%s\n' "$BODY" > release_body.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install slackify-markdown
        run: npm install --no-save --prefix /tmp/slackify slackify-markdown@5

      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL || '' }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "SLACK_BOT_TOKEN or SLACK_CHANNEL not set, skipping notification"
            exit 0
          fi

          [ -f release_body.txt ] || { echo "No release body found"; exit 0; }

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ matrix.tag }}"
          HEADER_TEXT="Helm Chart Release: ${{ matrix.tag }}"
          RELEASE_LINK="<${RELEASE_URL}|View release>"
          WORKFLOW_LINK="<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"

          # Node's ESM resolver only finds the package via a parent-dir walk, so run from the install dir.
          WORKSPACE_DIR="$PWD"
          CLEAN_BODY=$(cd /tmp/slackify && node --input-type=module -e "
            import {slackifyMarkdown} from 'slackify-markdown';
            import {readFileSync} from 'node:fs';
            process.stdout.write(slackifyMarkdown(readFileSync('$WORKSPACE_DIR/release_body.txt','utf8')));
          ")

          CLEAN_BODY=$(printf '%s' "$CLEAN_BODY" | sed -E \
            -e 's/<!--[^>]*-->//g' \
            -e "/\\*What's Changed\\*/d" \
            -e '/\*New Contributors\*/d' \
            -e '/\*Full Changelog\*/d' \
            -e 's/ by @[^ ]+ in <[^|]+\|[^>]+>$//' \
            -e '/^[[:space:]]*$/d')

          CLEAN_BODY=$(printf '%s' "$CLEAN_BODY" | sed -z 's/\n*$//')
          if [ -z "$(echo "$CLEAN_BODY" | tr -d '[:space:]')" ]; then
            CLEAN_BODY="Release *${{ matrix.tag }}* is now available. <${RELEASE_URL}|View release>"
          fi

          # Slack section blocks cap text at 3000 chars.
          MAX_BODY_LEN=2800
          if [ "${#CLEAN_BODY}" -gt "$MAX_BODY_LEN" ]; then
            CLEAN_BODY="${CLEAN_BODY:0:$MAX_BODY_LEN}..."$'\n\n'"<${RELEASE_URL}|Read full release notes>"
          fi
          RELEASE_BODY=$(printf '%s\n' "$CLEAN_BODY" | jq -Rs .)

          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg header "$HEADER_TEXT" \
            --argjson body "$RELEASE_BODY" \
            --arg release_link "$RELEASE_LINK" \
            --arg workflow_link "$WORKFLOW_LINK" \
            '{
              channel: $channel,
              text: $header,
              blocks: [
                { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: $body } },
                { type: "context", elements: [{ type: "mrkdwn", text: ($release_link + " | " + $workflow_link) }] }
              ]
            }')

          HTTP_CODE=$(curl -s -o /tmp/slack_response.json -w "%{http_code}" -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Slack API returned HTTP $HTTP_CODE"
            cat /tmp/slack_response.json
            exit 1
          fi
          if grep -q '"ok":\s*false' /tmp/slack_response.json 2>/dev/null; then
            echo "Slack API returned error:"
            cat /tmp/slack_response.json
            exit 1
          fi
          echo "Slack notification sent successfully for ${{ matrix.tag }}"
