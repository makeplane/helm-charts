name: Chart Tests

on:
  pull_request:
    paths:
      - "charts/plane-enterprise/**"
      - ".github/workflows/chart-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plane-enterprise:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # render-test.sh compares Plane AI's manifests with the base branch.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: |
          helm lint charts/plane-enterprise
          for values in charts/plane-enterprise/ci/*-values.yaml; do
            helm lint charts/plane-enterprise -f "$values"
          done

      - name: Render and assert
        env:
          # yq (mikefarah v4) and jq ship with the ubuntu runner image.
          BASE_REF: origin/${{ github.base_ref || 'master' }}
        run: charts/plane-enterprise/ci/render-test.sh
